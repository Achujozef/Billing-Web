<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temple Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css?v=2.0">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column">
  <div>
    <div class="sidebar-header">
      <h4>Temple Billing</h4>
    </div>
    <nav class="nav flex-column">
      <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        📊 Dashboard
      </a>
      <a href="{% url 'pooja_list' %}" class="nav-link {% if request.resolver_match.url_name == 'pooja_list' %}active{% endif %}">
        🙏 Poojas
      </a>
      <a href="{% url 'subscription_list' %}" class="nav-link {% if request.resolver_match.url_name == 'subscription_list' %}active{% endif %}">
        📜 Subscription
      </a>
      <a href="{% url 'festival_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'festival_dashboard' %}active{% endif %}">
        🎉 Festival Billing
      </a>
      <a href="{% url 'report_view' %}" class="nav-link {% if request.resolver_match.url_name == 'report_view' %}active{% endif %}">
        📑 Report
      </a>
    </nav>
  </div>
  
<!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="d-flex flex-column gap-2 text-center">
      <span class="text-white">
        👋 Welcome!
      </span>
      <span class="text-white">
         Today: {{ current_date }}
      </span>
    <span class="text-white">
      Time: <span id="clock">{{ current_time }}
    </span>
      <a href="{% url 'logout' %}" class="btn btn-sm btn-danger w-100 mt-3">🚪 Logout</a>

    <!-- Credit & Rights Section -->
      <small class="text-white mt-2 d-block">
        ⚡ Built with ❤️ by <strong>Ecomix</strong><br>
        © {{ current_date|date:"Y" }} Ecomix. All Rights Reserved.<br>
        <span class="text-white">Version v1.0</span>
      </small>
    </div>
  </div>
</div>


  <!-- Main Content -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/base.js"></script>
</body>
</html>
