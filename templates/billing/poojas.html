{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/css/poojas.css">

<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-secondary">🙏 Manage Poojas</h3>
    <button class="btn btn-dark" onclick="openPoojaModal()">+ Add Pooja</button>
  </div>

  <!-- Scrollable Pooja Grid Wrapper -->
  <div id="pooja-grid-wrapper">
    <div class="row g-3" id="pooja-grid">
      {% for pooja in poojas %}
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card shadow-sm p-3 text-center h-100" style="border-radius:16px; background:#fafafa; transition: transform 0.3s, box-shadow 0.3s;">
          <h5 class="fw-semibold text-dark">{{ pooja.pooja_name }}</h5>
          <p class="mb-3 text-muted">₹{{ pooja.price }}</p>
          <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-outline-dark btn-sm w-100" onclick="editPooja({{ pooja.id }}, '{{ pooja.pooja_name }}', {{ pooja.price }})">Edit</button>
            <button class="btn btn-outline-danger btn-sm w-100" onclick="deletePooja({{ pooja.id }})">Delete</button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>




<!-- Pooja Modal -->
<div class="modal fade" id="poojaModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg" style="background:#ffffff;">
      <div class="modal-header bg-dark text-white rounded-top-4">
        <h5 class="modal-title fw-bold" id="poojaModalLabel">Add Pooja</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pooja-id">

        <!-- POSITIONED WRAPPER FOR SUGGESTIONS -->
        <div class="mb-3 position-relative">
          <label class="form-label fw-medium">Pooja Name</label>
          <input type="text" id="pooja-name" class="form-control form-control-sm" placeholder="Enter pooja name" autocomplete="off">
          <div id="suggestions" class="d-none"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-medium">Price</label>
          <input type="number" id="pooja-price" class="form-control form-control-sm" min="0" step="0.01" placeholder="₹0.00">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-dark" onclick="savePooja()">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
function confirmPassword() {
  return new Promise((resolve) => {
    const entered = prompt("Enter admin password to continue:");
    if (entered === "admin@123") {
      resolve(true);  
    } else {
      alert("❌ Invalid password");
      resolve(false);
    }
  });
}

let poojaModal;

document.addEventListener("DOMContentLoaded", function() {
  poojaModal = new bootstrap.Modal(document.getElementById("poojaModal"));
});

function openPoojaModal() {
  document.getElementById("poojaModalLabel").innerText = "Add Pooja";
  document.getElementById("pooja-id").value = "";
  document.getElementById("pooja-name").value = "";
  document.getElementById("pooja-price").value = "";
  poojaModal.show();
}

function editPooja(id, name, price) {
  document.getElementById("poojaModalLabel").innerText = "Edit Pooja";
  document.getElementById("pooja-id").value = id;
  document.getElementById("pooja-name").value = name;
  document.getElementById("pooja-price").value = price;
  poojaModal.show();
}

async function savePooja() {
  if (!(await confirmPassword())) return;

  let id = document.getElementById("pooja-id").value;
  let name = document.getElementById("pooja-name").value.trim();
  let price = parseFloat(document.getElementById("pooja-price").value);
  if (!name || isNaN(price)) {
    alert("Please fill all fields correctly");
    return;
  }

  fetch("{% url 'save_pooja' %}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({ id, pooja_name: name, price })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        location.reload();
      } else {
        alert("Error: " + data.error);
      }
    })
    .catch(err => alert("AJAX Error: " + err));
}

async function deletePooja(id){
  if(!confirm("Are you sure you want to delete this pooja?")) return;
  if (!(await confirmPassword())) return;
  fetch(`/poojas/delete/${id}/`, {method: "POST", headers: {"X-CSRFToken": "{{ csrf_token }}"}})
    .then(res => res.json())
    .then(data => {
      if(data.success) location.reload();
      else alert("Error: " + data.error);
    });
}
</script>








<script>
/* Robust Manglish→Malayalam suggestions (uses /api/transliterate/ proxy) */
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("pooja-name");
  const box = document.getElementById("suggestions");
  const modalEl = document.getElementById("poojaModal");

  if (!input || !box) {
    console.warn("Transliteration: missing #pooja-name or #suggestions element - aborting.");
    return;
  }

  // initial state (keep bootstrap's d-none on the element initially)
  let activeIndex = 0;
  let items = [];
  let debounceTimer = null;
  let abortController = null;
  const cache = new Map(); // simple in-memory cache: word -> suggestions array
  const DEBOUNCE_MS = 120;
  const MAX_SUGGESTIONS = 6;

  // helpers to show/hide using d-none class (Bootstrap uses !important)
  const showBox = () => box.classList.remove("d-none");
  const hideBox = () => box.classList.add("d-none");
  const clearBox = () => { box.innerHTML = ""; items = []; activeIndex = 0; };

  function getLastWord(txt) {
    if (!txt) return "";
    const parts = txt.trim().split(/\s+/);
    return parts.length ? parts[parts.length - 1] : "";
  }

  function replaceLastWord(txt, replacement) {
    const parts = (txt || "").trim().split(/\s+/);
    if (!parts.length) return (replacement || "") + " ";
    parts[parts.length - 1] = (replacement || "");
    return parts.join(" ") + " ";
  }

  function renderSuggestions(list) {
    clearBox();
    if (!Array.isArray(list) || list.length === 0) return hideBox();
    const slice = list.slice(0, MAX_SUGGESTIONS);
    slice.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "item" + (i === 0 ? " active" : "");
      div.setAttribute("role", "option");
      div.textContent = s;
      // mousedown prevents blur before click handler (keeps focus)
      div.addEventListener("mousedown", (evt) => {
        evt.preventDefault();
        commitSuggestion(s);
      });
      box.appendChild(div);
    });
    items = Array.from(box.querySelectorAll(".item"));
    activeIndex = 0;
    showBox();
  }

  function setActive(index) {
    if (!items.length) return;
    items[activeIndex]?.classList.remove("active");
    activeIndex = ((index % items.length) + items.length) % items.length;
    items[activeIndex]?.classList.add("active");
    // ensure visible
    items[activeIndex]?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function commitSuggestion(choice) {
    if (!choice) return;
    input.value = replaceLastWord(input.value, choice);
    // notify other listeners that input changed (so validation/other code runs)
    input.dispatchEvent(new Event("input", { bubbles: true }));
    clearBox();
    hideBox();
  }

  async function fetchSuggestionsFor(word) {
    if (!word) return [];
    if (cache.has(word)) return cache.get(word);

    // cancel previous
    if (abortController) {
      try { abortController.abort(); } catch (e) {}
    }
    abortController = new AbortController();
    try {
      const url = `/api/transliterate/?q=${encodeURIComponent(word)}`;
      const res = await fetch(url, { method: "GET", credentials: "same-origin", signal: abortController.signal });
      if (!res.ok) throw new Error("Network response not ok");
      const data = await res.json();
      const result = Array.isArray(data.suggestions) ? data.suggestions : [];
      cache.set(word, result);
      return result;
    } catch (err) {
      if (err.name === "AbortError") {
        // aborted — not an error we should report
        return [];
      }
      console.warn("Transliteration fetch error:", err);
      return [];
    }
  }

  async function handleInputEvent() {
    const last = getLastWord(input.value);
    if (!last) { clearBox(); hideBox(); return; }

    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
      const qAtCall = last;
      const suggestions = await fetchSuggestionsFor(qAtCall);
      // discard results if user typed further
      const currentLast = getLastWord(input.value);
      if (currentLast !== qAtCall) {
        // stale result — ignore
        return;
      }
      renderSuggestions(suggestions);
    }, DEBOUNCE_MS);
  }

  function handleKeyDown(e) {
    if (box.classList.contains("d-none") || !items.length) return;

    if (e.key === "Enter") {
      e.preventDefault();
      const choice = items[activeIndex]?.textContent || items[0]?.textContent;
      if (choice) commitSuggestion(choice);
    } else if (e.key === "Tab") {
      const choice = items[activeIndex]?.textContent || items[0]?.textContent;
      if (choice) commitSuggestion(choice);
      // allow default tab to move focus
    } else if (e.key === " ") {   // <<==== SPACE KEY HANDLING
      e.preventDefault();
      const choice = items[activeIndex]?.textContent || items[0]?.textContent;
      if (choice) commitSuggestion(choice);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      setActive(activeIndex + 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setActive(activeIndex - 1);
    } else if (e.key === "Escape") {
      hideBox();
      clearBox();
    }
  }


  // Hide suggestions shortly after losing focus (allow click)
  function handleBlur() {
    setTimeout(() => {
      hideBox();
      clearBox();
    }, 150);
  }

  // wire events
  input.addEventListener("input", handleInputEvent);
  input.addEventListener("keydown", handleKeyDown);
  input.addEventListener("blur", handleBlur);

  // when modal shown, focus and select input
  if (modalEl) {
    modalEl.addEventListener("shown.bs.modal", () => {
      try { input.focus(); input.select(); } catch (e) {}
    });
  }
});
</script>



{% endblock %}
