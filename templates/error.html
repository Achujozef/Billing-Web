{% comment %} {% extends "base.html" %}
{% load static %}
{% block content %}

<div class="error-box">
    <img src="{% static 'image/warning_icon.svg' %}" 
         alt="Warning" 
         width="28" 
         height="28"
         style="vertical-align: middle;">
    <span>{{ error_message }}</span>
</div>

{% endblock %} {% endcomment %}

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm border-0">
                <div class="card-body text-center p-5">

                    <img src="https://www.svgrepo.com/show/502912/warning-1.svg" 
                         width="150" height="150" class="mb-4" alt="Warning">

                    <h3 class="text-danger fw-bold mb-3">
                        ⚠️ Something Went Wrong
                    </h3>

                    <div class="alert alert-danger text-start">
                        {{ error_message }}
                    </div>

                    <div class="mt-4">
                        <a href="javascript:history.back()" class="btn btn-primary px-4">
                            ← Go Back
                        </a>
                        <a href="/" class="btn btn-outline-secondary ms-2 px-4">
                            Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
