<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temple Billing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #f8f9fa; 
      margin: 0;
    }

    /* Sidebar */
    .sidebar {
      height: 100vh;
      background: #343a40;
      color: #f8f9fa;
      position: fixed;
      width: 220px;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .sidebar-header h4 {
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .sidebar .nav-link {
      color: #ced4da;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      border-radius: 0.375rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sidebar .nav-link:hover {
      background: #495057;
      color: #fff;
      text-decoration: none;
    }

    .sidebar .nav-link.active {
      background: #495057;
      color: #fff;
      font-weight: 600;
    }

    /* Sidebar Footer */
    .sidebar-footer {
      padding: 1rem;
      font-size: 0.85rem;
      color: #adb5bd;
      border-top: 1px solid #495057;
    }

    /* Main content */
    .content {
      margin-left: 220px;
      padding: 2rem;
    }

    .navbar-text {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Card style */
    .card {
      border-radius: 12px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .content {
        margin-left: 0;
        padding: 1rem;
      }
    }
  </style>
  <style>
/* Suggestions dropdown */
#suggestions {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 2px);
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  z-index: 1056; /* above modal content */
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  max-height: 220px;
  overflow-y: auto;
}
#suggestions .item {
  padding: 6px 12px;
  cursor: pointer;
  font-size: 14px;
  user-select: none;
}
#suggestions .item:hover,
#suggestions .item.active {
  background: #f1f1f1;
  font-weight: 600;
}
#pooja-modal-list .col {
  margin-bottom: 1px; /* Adjust this value as needed */
}
</style>


<style>
/* Suggestions dropdown for customer and product inputs */
#customer_suggestions,
#product_suggestions {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 2px);
  background: #fafafaff;
  border: 1px solid #ddd;
  border-radius: 8px;
  z-index: 1056; /* above modal content */
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  max-height: 220px;
  overflow-y: auto;
}

#customer_suggestions .list-group-item,
#product_suggestions .list-group-item {
  padding: 6px 12px;
  cursor: pointer;
  font-size: 14px;
  user-select: none;
}

#customer_suggestions .list-group-item:hover,
#product_suggestions .list-group-item:hover,
#customer_suggestions .list-group-item.active,
#product_suggestions .list-group-item.active {
  background: #000000ff;
  font-weight: 600;
}
</style>


</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column">
  <div>
    <div class="sidebar-header">
      <h4>Temple Billing</h4>
    </div>
    <nav class="nav flex-column">
      <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        📊 Dashboard
      </a>
      <a href="{% url 'pooja_list' %}" class="nav-link {% if request.resolver_match.url_name == 'pooja_list' %}active{% endif %}">
        🙏 Poojas
      </a>
      <a href="{% url 'subscription_list' %}" class="nav-link {% if request.resolver_match.url_name == 'subscription_list' %}active{% endif %}">
        📜 Subscription
      </a>
      <a href="{% url 'report_view' %}" class="nav-link {% if request.resolver_match.url_name == 'report_view' %}active{% endif %}">
        📑 Report
      </a>
    </nav>
  </div>
  
<!-- Sidebar Footer -->
<div class="sidebar-footer">
  <div class="d-flex flex-column gap-2 text-center">
    <span class="navbar-text text-white">
      👋 Welcome! Today: {{ current_date }} | Time: <span id="clock">{{ current_time }}</span>
    </span>
    <a href="{% url 'logout' %}" class="btn btn-sm btn-danger w-100">🚪 Logout</a>

    <!-- Credit & Rights Section -->
    <small class="text-white mt-2 d-block">
      ⚡ Built with ❤️ by <strong>Ecomix</strong><br>
      © {{ current_date|date:"Y" }} Ecomix. All Rights Reserved.<br>
      <span class=" text-white">Version v1.0</span>
    </small>
  </div>
</div>




</div>


  <!-- Main Content -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Update clock live
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        now.getHours().toString().padStart(2, '0') + ":" +
        now.getMinutes().toString().padStart(2, '0') + ":" +
        now.getSeconds().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
